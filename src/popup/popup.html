<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Images Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div>Enable extension</div>
  <label class="toggle">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
  <hr>
  <label for="filterType">Filter type:</label>
  <select id="filterType">
    <option value="brightness">Brightness/Contrast</option>
    <option value="invert">Invert</option>
  </select>
  <div id="brightnessControls" style="margin-top:8px;">
    <label for="brightness">Brightness (0.1‑1.0):</label>
    <input type="range" id="brightness" min="0.1" max="1.0" step="0.1" value="0.7">
    <span id="brightnessValue">0.7</span>
    <br>
    <label for="contrast">Contrast (0.1‑1.0):</label>
    <input type="range" id="contrast" min="0.1" max="1.0" step="0.1" value="0.7">
    <span id="contrastValue">0.7</span>
    <br>
    <label for="saturate">Saturate (0.1‑1.0):</label>
    <input type="range" id="saturate" min="0.1" max="1.0" step="0.1" value="0.7">
    <span id="saturateValue">0.7</span>
  </div>
  <p id="warning" style="color:#c00; display:none; margin-top:8px;">Changes will be applied after reloading the tab.</p>
  <script src="popup.js"></script>
</body>
</html>
