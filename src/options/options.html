<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Images Settings</title>
  <link rel="stylesheet" href="../popup/popup.css">
</head>
<body>
  <label class="toggle">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
    Enable extension
  </label>
  <hr>
  <label for="filterType">Filter type:</label>
  <select id="filterType">
    <option value="brightness">Brightness/Contrast</option>
    <option value="invert">Invert</option>
  </select>
  <div id="brightnessControls" style="margin-top:8px;">
    <label for="intensity">Intensity (0.1‑1.0):</label>
    <input type="range" id="intensity" min="0.1" max="1.0" step="0.1" value="0.7">
    <span id="intensityValue">0.7</span>
  </div>
  <p id="warning" style="color:#f88; display:none; margin-top:8px;">Changes will be applied after reloading the tab.</p>
  <script src="../popup/popup.js"></script>
</body>
</html>
